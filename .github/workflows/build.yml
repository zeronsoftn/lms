name: Build Windows (x64)

on:
  push:

jobs:
  build-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        arch:
          - {cmake: "x64", triplet: "x64-windows-static", suffix: "win64"}
          - {cmake: "Win32", triplet: "x86-windows-static", suffix: "win32"}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11

    - name: Configure (CMake + vcpkg toolchain, VS generator)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        mkdir build -Force

        cmake -S . -B build `
          -G "Visual Studio 17 2022" -A ${{ matrix.arch.cmake }} `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=${{ matrix.arch.triplet }} `
          -DCMAKE_BUILD_TYPE=Release `
          -DIGNORE_DLL_SIGNATURES=YES `
          -DCMAKE_C_FLAGS="-DWIN32 -D_CRT_SECURE_NO_WARNINGS -D_WINSOCK_DEPRECATED_NO_WARNINGS" `
          -DCMAKE_CXX_FLAGS="-DWIN32 -D_CRT_SECURE_NO_WARNINGS -D_WINSOCK_DEPRECATED_NO_WARNINGS"

    - name: Build (Release)
      shell: pwsh
      run: cmake --build build --config Release --target package

    - name: Upload package
      if: success()
      uses: actions/upload-artifact@v6
      with:
        name: lms-${{ matrix.arch.suffix }}
        path: |
          build/lms-*-${{ matrix.arch.suffix }}.zip

  release:
    runs-on: ubuntu-latest

    needs:
      - build-windows

    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist/
          pattern: lms-*
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/*

